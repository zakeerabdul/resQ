{% extends 'base.html' %}
{% block title %}Shelter Registration | ResQ{% endblock %}
{% block content %}
<section class="section">
  <div class="container form-layout">
    <div class="panel">
      <h1>Shelter Provider Registration</h1>
      <form method="post" class="stack-form">
        <div class="two-col">
          <label>Shelter name<input type="text" name="shelter_name" required /></label>
          <label>Authorized contact<input type="text" name="contact_name" required /></label>
        </div>
        <div class="two-col">
          <label>Email<input type="email" name="email" required /></label>
          <label>Mobile number<input type="tel" name="phone" required /></label>
        </div>
        <div class="two-col">
          <label>Password<input type="password" name="password" required /></label>
          <label>Total capacity<input type="number" name="total_capacity" value="0" min="0" /></label>
        </div>
        <div class="two-col">
          <label>Occupied spaces<input type="number" name="occupied_spaces" value="0" min="0" /></label>
          <label>Available spaces<input type="number" name="available_spaces" value="0" min="0" /></label>
        </div>
        <label>Shelter address<input type="text" name="address" required /></label>
        <div class="two-col">
          <label>Latitude<input type="number" step="any" name="latitude" /></label>
          <label>Longitude<input type="number" step="any" name="longitude" /></label>
        </div>
        <label>Service area<input type="text" name="service_area" /></label>
        <label>Facilities<textarea name="facilities" rows="3"></textarea></label>
        <button class="button primary" type="submit">Register Shelter</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
