services:
  - type: web
    name: resq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: resq-db
    databaseName: resq
    user: resq
    plan: free
